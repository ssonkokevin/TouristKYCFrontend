server {
    listen 8900;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real log files (not the base image's default symlinks to
    # stdout/stderr), so they can be bind-mounted to a host-visible
    # directory alongside the backend's logs — see docker-compose.yml.
    access_log /var/log/kyc-frontend/access.log;
    error_log /var/log/kyc-frontend/error.log warn;

    # Proxy API calls to the backend container
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.IO to the backend container
    location /socket.io/ {
        proxy_pass http://backend:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
